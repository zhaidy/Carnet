name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARNET_KEYSTORE_PASSWORD: ${{ secrets.CARNET_KEYSTORE_PASSWORD }}
      CARNET_KEY_ALIAS: ${{ secrets.CARNET_KEY_ALIAS }}
      CARNET_KEY_PASSWORD: ${{ secrets.CARNET_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要用到之前的 build-* 标签和提交历史
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # 默认还会装已下架的 "tools" 包而失败；SDK 平台由 Gradle 按需下载
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # 固定签名密钥放在 Secrets 里；没配置时退回调试签名（此时 APK 不能覆盖安装旧版）
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARNET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/carnet.keystore"
            echo "CARNET_KEYSTORE_FILE=$RUNNER_TEMP/carnet.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::CARNET_KEYSTORE_BASE64 未配置，使用调试签名"
          fi
      # Firebase 配置放在 Secrets 里，不进仓库；没配置时用占位的，能编译但和她同步不可用
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::warning::GOOGLE_SERVICES_JSON 未配置，和她同步不可用"; fi
          ./scripts/write-google-services.sh
      - run: chmod +x gradlew && ./gradlew assembleRelease testDebugUnitTest
      - run: mv app/build/outputs/apk/release/app-release.apk carnet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: carnet-apk
          path: carnet.apk
      # 只有 main 上的构建才发 Release；更新说明是上一个 build-* 标签之后 main 上的提交标题
      - name: Release notes
        if: github.ref == 'refs/heads/main' && env.CARNET_KEYSTORE_FILE != ''
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="-1"; fi
          git log $range --no-merges --format='%s' | sed -E 's/ \(#[0-9]+\)$//; s/^/- /' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.CARNET_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Carnet build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: carnet.apk
          make_latest: true
